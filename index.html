<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
    <title data-i18n="portfolio">Potfolio</title>
</head>
<header>
    <div class="avatar">
        <img src="" alt=""></img>
    </div>
    <div class="main">
        <div class="nickname">
            <h1 data-i18n="portfolio_nickname">nickname</h1>
        </div>
        <div class="title">
            <h1 data-i18n="portfolio_title">title</h1>
        </div>
        <div class="tags">
            <h1 data-i18n="portfolio_tags">tags</h1>
        </div>
        <div class="function_buttons">
            <button class="language">
                <img src="" alt=""></img>
            </button>
            <button class="theme">
                <img src="" alt=""></img>
            </button>
        </div>
    </div>
    <div class="about_me">
        <h2 data-i18n="header_aboutme">About me</h2>
        <p data-i18n="header_aboutme_text">text</p>
        <button>
            <p data-i18n="header_aboutme_button">link</p>
        </button>
    </div>
    <div class="forward">
        <button class="watch">
            <p data-i18n="header_project_button">watch</p>
        </button>
        <button class="skills">
            <p data-i18n="header_skill_button">skills</p>
        </button>
        <button class="contacts">
            <p data-i18n="header_contact_button">contacts</p>
        </button>
    </div>
</header>
<body>
    <div class="projects">
        <h1 data-i18n="h1_project">project</h1>
        <div class="selector">
            <select name="" id="select_projects">
                <option value="landing-tea">I</option>
                <option value="test">II</option>
                <option value="3">III</option>
            </select>
        </div>
        <div class="main" id="main_projects">
            <!-- Вызов темплейта -->
        </div>
    </div>
    <div class="skills">
        <h1 data-i18n="h1_skill">skill</h1>
        <div class="main" id="main_skills">
            <!-- Вызов темплейта -->
        </div>
    </div>
    <div class="experience">
        <h1 data-i18n="h1_experience">Exp</h1>
        <div class="all_exp" id="main_exp">
            <!-- Вызов темплейта -->
        </div>
    </div>
    <div class="contacts">
        <h1 data-i18n="h1_contact">contacts</h1>
        <div class="all_contacts">
            <!-- Вызов темплейта -->
        </div>
    </div>
</body>
<footer>
    <p data-i18n="footer_copyright">name</p>
    <p data-i18n="footer_info">info</p>
    <p data-i18n="footer_right">rights</p>
</footer>
</html>
