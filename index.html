<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            if (localStorage.getItem('theme') !== null) {
                document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));
            }
        } catch {};
    </script>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
    <title data-i18n="portfolio">Potfolio</title>
</head>
<header>
    <div class="avatar">
        <img src="data/picture/avatar.png" data-i18n="header_alt_avatar" alt="___"></img>
    </div>
    <div>
        <div class="main">
            <div class="nickname">
                <h1 data-i18n="portfolio_nickname">nickname</h1>
            </div>
            <div class="title">
                <h1 data-i18n="portfolio_title">title</h1>
            </div>
            <div class="tags">
                <h1 data-i18n="portfolio_tags">tags</h1>
            </div>
            <div class="function_buttons">
                <div>
                    <button class="language" id="language_button">
                        <i class="fa-regular fa-globe"></i>
                    </button>
                    <ul class="dropdown_menu invisible">
                        <li>
                            <button id="switch-ru">
                                <span>&#x1F1F7;&#x1F1FA;</span>
                                <span>russian</span>
                            </button>
                        </li>
                        <li>
                            <button id="switch-en">
                                <span>&#x1F1EC;&#x1F1E7;</span>
                                <span>english</span>
                            </button>
                        </li>
                    </ul>
                </div>
                <div class="theme">
                    <button class="light">
                        <i class="fa-solid fa-sun-bright"></i>
                    </button>
                    <button class="auto">
                        <i class="fal fa-eclipse"></i>
                    </button>
                    <button class="dark">
                        <i class="fad fa-moon"></i>
                    </button>
                    <span class="target_theme"></span>
                </div>
            </div>
        </div>
        <div class="about_me">
            <h2 data-i18n="header_aboutme">About me</h2>
            <p data-i18n="header_aboutme_text">text</p>
            <button id="button_more_info">
                <p data-i18n="header_aboutme_button">link</p>
            </button>
        </div>
        <div class="forward">
            <button class="watch original">
                <p data-i18n="header_project_button">watch</p>
                <span></span>
            </button>
            <button class="skills original">
                <p data-i18n="header_skill_button">skills</p>
                <span></span>
            </button>
            <button class="contacts original">
                <p data-i18n="header_contact_button">contacts</p>
                <span></span>
            </button>
        </div>
    </div>
</header>
<body>
    <div class="projects">
        <h1 data-i18n="h1_project">project</h1>
        <div>
            <div class="selector" id="select_projects">
                <label class="project_radio_label">
                    <input type="radio" name="project" value="project_1" checked>
                    <span class="custom_radio">I</span>
                </label>
                <label class="project_radio_label">
                    <input type="radio" name="project" value="project_2">
                    <span class="custom_radio">II</span>
                </label>
                <label class="project_radio_label">
                    <input type="radio" name="project" value="project_3">
                    <span class="custom_radio">III</span>
                </label>
            </div>
            <div class="main" id="main_projects">
            </div>
        </div>
    </div>
    <div class="skills">
        <h1 data-i18n="h1_skill">skill</h1>
        <div class="main" id="main_skills">
        </div>
    </div>
    <div class="experience">
        <h1 data-i18n="h1_experience">Exp</h1>
        <div class="all_exp" id="main_exp">
        </div>
    </div>
    <div class="contacts">
        <h1 data-i18n="h1_contact">contacts</h1>
        <div class="main" id="main_contacts">
        </div>
        <div>
            <p data-i18n="the_end_contact">lets</p>
        </div>
    </div>
</body>
<footer>
    <p data-i18n="footer_copyright">name</p>
    <p data-i18n="footer_info">info</p>
    <p data-i18n="footer_right">rights</p>
</footer>
</html>


<dialog id="more_info">
    <div>
        <form method="dialog">
            <button class="cross">
                <i class="fas fa-times"></i>
            </button>
        </form>
        <p data-i18n="header_aboutme_full_text">
        </p>
    </div>
</dialog>
